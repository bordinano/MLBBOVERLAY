<!DOCTYPE html>
<html>
<head>
    <title>Video Display</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* Pastikan background transparan untuk OBS */
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #videoPlayer {
            width: 1920px;
            height: 1080px;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="videoPlayer" muted playsinline>
            <source id="videoSource" src="" type="video/webm">
        </video>
    </div>

    <script>
        // Database video sederhana
        // Make sure these filenames match EXACTLY what's in Assets/notification/
        // (case-sensitive on Linux, and spaces must match too).
        const videoDatabase = {
            'videoPlayer1': 'Assets/notification/Turtle Spawn.webm',
            'videoPlayer2': 'Assets/notification/Blue Turtle Slain Notif.webm',
            'videoPlayer3': 'Assets/notification/Red Turtle Slain Notif.webm',
            'videoPlayer4': 'Assets/notification/Lord Spawn.webm',
            'videoPlayer5': 'Assets/notification/Blue Lord Slain Notif.webm',
            'videoPlayer6': 'Assets/notification/Red Lord Slain Notif.webm',
            'videoPlayer7': 'Assets/notification/First Blood.webm',
            'videoPlayer8': 'Assets/notification/Double Kill.webm',
            'videoPlayer9': 'Assets/notification/Triple Kill.webm',
            'videoPlayer10': 'Assets/notification/Maniac.webm',
            'videoPlayer11': 'Assets/notification/Savage.webm',
            'videoPlayer12': 'Assets/notification/WIPEOUT.webm'
        };

        const videoPlayer = document.getElementById('videoPlayer');
        const videoSource = document.getElementById('videoSource');
        let isPlaying = false;
        let lastPlayedId = null; // guards against re-triggering the same video

        // --- Extra debugging: this will show up in the OBS browser source's
        // dev tools console (right-click the source -> "Interact" won't show
        // console; use right-click -> "Custom Browser Docks" won't either.
        // Easiest way: open this same URL in a normal Chrome tab and use
        // F12 -> Console/Network to see real errors, since OBS's built-in
        // console is harder to reach.)
        videoPlayer.addEventListener('error', (e) => {
            console.error('Video element error:', videoPlayer.error, 'src:', videoSource.src);
        });
        videoSource.addEventListener('error', (e) => {
            console.error('Source failed to load (likely 404 or unsupported codec):', videoSource.src);
        });
        videoPlayer.addEventListener('canplay', () => {
            console.log('Video can play:', videoSource.src);
        });

        // --- WEBSOCKET CONNECTION ---
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

        ws.onopen = () => {
            console.log('Connected to Server for Notifications');
        };

        ws.onerror = (e) => {
            console.error('WebSocket error - is the server running and is this page loaded via http(s), not file://?', e);
        };

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                console.log('WS message received:', msg);

                // The server's actual WebSocket broadcast for a notification is
                // { type: "notification_trigger", videoId: "videoPlayer7" }
                // (the "currentVideo" shape is only what gets saved to notification.json
                // on disk, not what's broadcast live).
                if (msg.type === 'notification_trigger' && msg.videoId && msg.videoId !== lastPlayedId) {
                    lastPlayedId = msg.videoId;
                    playVideoById(msg.videoId);
                }
            } catch (e) {
                console.error('Error parsing WS message:', e);
            }
        };

        function playVideoById(playerId) {
            // Jika video ID valid dan ada di database
            if (!videoDatabase[playerId]) {
                console.warn('Unknown videoId, not in database:', playerId);
                return;
            }

            // Hentikan video lama jika sedang jalan (opsional, tergantung preferensi mau ditumpuk atau reset)
            if (isPlaying) {
                videoPlayer.pause();
                videoPlayer.currentTime = 0;
            }

            // Setup source baru
            videoSource.src = videoDatabase[playerId];
            videoPlayer.load(); // Reload source
            videoPlayer.style.display = 'block';
            isPlaying = true;

            // Play video
            const playPromise = videoPlayer.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Auto-play prevented or playback failed:', error, 'src:', videoSource.src);
                    isPlaying = false;
                    videoPlayer.style.display = 'none';
                });
            }

            // Reset when video ends
            videoPlayer.onended = () => {
                isPlaying = false;
                lastPlayedId = null; // allow the same trigger to fire again later
                videoPlayer.style.display = 'none';
                videoSource.src = '';
            };
        }

        // --- Manual test helper ---
        // Open this page in a normal Chrome tab (not OBS) and run in console:
        //   playVideoById('videoPlayer1')
        // This lets you test playback and paths without needing the WebSocket
        // server running at all.
        window.playVideoById = playVideoById;
    </script>
</body>
</html>
